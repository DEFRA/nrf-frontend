name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  static-checks:
    name: Run Static Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm ci --ignore-scripts
          npm run security-audit
          npm run format:check
          npm run lint

  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm ci --ignore-scripts
          npm run build:frontend
          npm test

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8 #  (or check latest version on https://github.com/marketplace/actions/official-sonarqube-scan)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    name: Test Docker Image Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set git hash
        run: echo "${{ github.sha }}" > .git-hash

      - name: Test Docker Image Build
        run: docker build --tag cdp-node-frontend-template .

      - name: Verify git hash in Docker image
        run: docker run --rm cdp-node-frontend-template cat .git-hash

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  journey-tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
      OS_API_KEY: ${{ secrets.OS_API_KEY }}
    steps:
      # Checked out into a subdirectory so the action finds it and builds the
      # image alongside the backend and impact assessor images, rather than
      # this job building it first.
      - uses: actions/checkout@v7
        with:
          path: nrf-frontend
      - uses: DEFRA/nrf-journey-tests/run-journey-tests@main
